[package]
name = "frigicom"
description = "Frigicom Logos Chat Client"
documentation = "https://github.com/doomcrack/halloy"
homepage = "https://github.com/doomcrack/halloy"
repository = "https://github.com/doomcrack/halloy"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = ["iosevka-font"]
iosevka-font = []
# Links liblogos_protocol and enables `Driver::Live`; needs
# LOGOS_PROTOCOL_ROOT at build time, so it is deliberately NOT a default
# feature — CI runners and the packaging scripts have no dylib to link
# against. Build the real client with `cargo build --features live` from
# the dev shell (`nix develop`, or `. scripts/dev-env.sh`). Without it the
# binary only drives the scripted mock and `[logos] mock = false` fails
# with `FfiUnavailable`.
live = ["data/live"]

# The Logos client stack lives in its own repository (doomcrack/logos-rs),
# dual MIT/Apache-2.0. It is not derived from halloy and does not depend on
# anything here; keeping it out of this workspace is what stops this fork's
# GPL from being the only licence in the tree. `tests/layering.rs` fails the
# build if a dependency edge ever points back the other way.
[workspace]
members = [
    "data",
    "ipc",
]

[workspace.package]
version = "0.1.0"
# Frigicom is a fork of halloy (https://github.com/squidowl/halloy); the
# authors below are halloy's, retained as attribution under GPL-3.0-or-later.
authors = ["Casper Rogild Storm", "Cory Forsstrom", "Andrew Baldwin"]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3" }
futures = "0.3.32"
thiserror = "2.0.18"
chrono = { version = "0.4.40", features = ['serde', 'unstable-locales'] }
strum = { version = "0.28.0", features = ["derive"] }
url = { version = "2.5.0", features = ["serde"] }
tokio-stream = { version = "0.1" }
itertools = "0.15.0"
emojis = "0.9.0"
unicode-segmentation = "1.13.2"
rand = "0.10.1"
rand_chacha = "0.10.0"
palette = "0.7.4"
log = { version = "0.4.30", features = ['std'] }
nucleo-matcher = "0.3.1"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-no-provider",
    "stream",
    "system-proxy",
] }
tokio-util = { version = "0.7", features = ["io"] }
const_format = "0.2.36"
iced = { version = "0.15.0-dev", default-features = false }
percent-encoding = "2.3.2"

[dependencies]
tokio = { workspace = true, features = ["rt", "fs", "process"] }
futures = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true, features = ["fs"] }
itertools = { workspace = true }
emojis = { workspace = true }
palette = { workspace = true }
log = { workspace = true }
nucleo-matcher = { workspace = true }
unicode-segmentation = { workspace = true }
image = "0.25"
# Only for installing the process-wide crypto provider `reqwest`'s
# `rustls-no-provider` leaves unset; see `main`.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
iced = { workspace = true, features = [
    "wgpu",
    "tiny-skia",
    "fira-sans",
    "tokio",
    "lazy",
    "advanced",
    "image",
    "svg",
    "wayland",
    "x11",
    "crisp",
    "web-colors",
    "highlighter",
] }

data = { version = "0.1.0", path = "data" }
ipc = { version = "0.1.0", path = "ipc" }
logos-client = { git = "https://github.com/doomcrack/logos-rs", rev = "03b2597457beff71ef16535f6484a830eb5dcf76", default-features = false }
serde_json = { workspace = true }

signal-hook = "0.3.18"
notify-rust = { version = "4.18", features = [ "images" ] }
fern = "0.7.1"
open = "5.0.1"
rodio = "0.22.0"
strsim = "0.11.1"
rfd = { version = "0.15.2", default-features = false, features = [
    "xdg-portal",
    "tokio",
] }
mundy = { version = "0.1.9", default-features = false, features = [
    "color-scheme",
    "tokio",
    "log",
] }

[dev-dependencies]
iced = { workspace = true, features = [
    "wgpu",
    "tiny-skia",
    "fira-sans",
    "tokio",
    "lazy",
    "advanced",
    "image",
    "svg",
    "wayland",
    "x11",
    "crisp",
    "web-colors",
    "debug",
] }
# UI test harness (`src/testkit`). `iced_runtime::task::into_stream` is the
# only way to drain an opaque `Task`; `iced_test` turns the real `view()`
# into queryable text. Both are already in the lock file at this rev.
iced_runtime = { git = "https://github.com/squidowl/iced", rev = "a6cd98b0debe317ba9ad0d8b364684939e086fa3" }
iced_test = { git = "https://github.com/squidowl/iced", rev = "a6cd98b0debe317ba9ad0d8b364684939e086fa3" }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[target.'cfg(windows)'.dependencies]
iced = { workspace = true, features = [
    "web-colors",
    "sysinfo",
] }

[target.'cfg(windows)'.dev-dependencies]
iced = { workspace = true, features = [
    "web-colors",
    "sysinfo",
    "debug",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSWorkspace",
    "NSPasteboard",
    "NSPasteboardItem",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"
windows_exe_info = "0.4"

[patch.crates-io]
iced = { git = "https://github.com/squidowl/iced", rev = "a6cd98b0debe317ba9ad0d8b364684939e086fa3" }
iced_core = { git = "https://github.com/squidowl/iced", rev = "a6cd98b0debe317ba9ad0d8b364684939e086fa3" }
iced_wgpu = { git = "https://github.com/squidowl/iced", rev = "a6cd98b0debe317ba9ad0d8b364684939e086fa3" }

[profile.packaging]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.ci]
inherits = "dev"
opt-level = 0

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
default_trait_access = "deny"
ignored_unit_patterns = "deny"
items_after_statements = "deny"
manual_is_variant_and = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
unnecessary_wraps = "deny"

[lints]
workspace = true

[workspace.metadata.typos.default]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$", # Ignore lines with trailing spellchecker:disable-line
]
extend-ignore-identifiers-re = [
    # Contributor handles in CHANGELOG.md
    "TehPeGaSuS",
    "0ther0ne",
]
