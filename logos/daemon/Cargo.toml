[package]
name = "logos-daemon"
description = "logoscore daemon supervision: locate, spawn, token, liveness, shutdown"
version = "0.1.0"
license.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "time", "fs", "io-util", "sync", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Signals are how a pid we did not spawn is probed and stopped; every use
# is behind `cfg(unix)`, so the dependency is too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[lints]
workspace = true
