[package]
name = "data"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "data"
path = "src/lib.rs"

[features]
# Pulls the lp_* FFI transport into the session state machine; the final
# binary must then link liblogos_protocol (see the workspace build.rs).
live = ["logos-chat/ffi"]

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["io-util", "fs", "rt", "time"] }
chrono = { workspace = true }
strum = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true, features = ["time", "fs"] }
itertools = { workspace = true }
emojis = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
palette = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }
const_format = { workspace = true }
iced = { workspace = true, features = [
    "sysinfo",
    "tokio",
    "wayland",
] }
percent-encoding = { workspace = true }

base64 = "0.22.1"
dirs-next = "2.0.0"
xdg = "3.0.0"
flate2 = "1.0"
hex = "0.4.3"
iced_core = "0.15.0-dev"
iced_wgpu = "0.15.0-dev"
indexmap = { version = "2.14", features = ["std", "serde"] }
logos-chat = { git = "https://github.com/doomcrack/logos-rs", rev = "d4d5941fcbf00e74c0e0064abd4ff7c53566c516", default-features = false }
logos-domain = { git = "https://github.com/doomcrack/logos-rs", rev = "d4d5941fcbf00e74c0e0064abd4ff7c53566c516" }
seahash = "4.1.0"
serde_json = "1.0"
serde_ignored = "0.1"
serde-untagged = "0.1"
sha2 = "0.11.0"
toml = { version = "1.1.2", features = ["preserve_order"] }
fancy-regex = "0.18"
walkdir = "2.5.0"
derive_more = { version = "2.0.1", features = ["full"] }
image = "0.25.10"
html-escape = "0.2.13"
display-info = "0.5.9"
sys-locale = "0.3"
idna = "1.1.0"
unicode-security = "0.1.2"

[dev-dependencies]
serde_test = "1.0"
# The corpus the domain crate's own parser tests use, so the integration
# assertions here cannot drift from a second copy.
logos-domain = { git = "https://github.com/doomcrack/logos-rs", rev = "d4d5941fcbf00e74c0e0064abd4ff7c53566c516", features = ["fixtures"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dependencies.serde]
version = "1.0"
features = ["derive", "rc"]

[lints]
workspace = true
